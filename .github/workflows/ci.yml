name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build mytools
        run: go build -o /usr/local/bin/mytools .

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [[ -n "$diff" ]]; then
            echo "gofmt would reformat:"; echo "$diff"; exit 1
          fi

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests
        run: go test ./... -v

      - name: Install bedtools (the oracle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bedtools
          bedtools --version

      - name: Golden tests
        run: ./tests/run_golden.sh
